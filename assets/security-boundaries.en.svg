<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Security boundaries</title><desc id="desc">High-level data and credential boundaries.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A101D"/><stop offset=".55" stop-color="#111A2B"/><stop offset="1" stop-color="#171A35"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF806E"/><stop offset="1" stop-color="#A89AFF"/></linearGradient>
 <linearGradient id="bluegreen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7F98FF"/><stop offset="1" stop-color="#46D5E5"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8CA4CE" fill-opacity=".12"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#030713" flood-opacity=".32"/></filter>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/><rect width="1200" height="420" rx="22" fill="url(#dots)"/>
<circle cx="1080" cy="40" r="210" fill="#A89AFF" opacity=".045"/><rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#2A3A54"/>
<text x="40" y="45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#46D5E5" text-anchor="start" >SECURITY &amp; DATA BOUNDARIES</text><text x="40" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#F3F6FC" text-anchor="start" >Separate credentials, configuration, and model context.</text><rect x="38" y="120" width="340" height="176" rx="16" fill="#17243A" stroke="#30445F"/><rect x="54" y="137" width="36" height="36" rx="10" fill="#42D6A4" fill-opacity=".16" stroke="#42D6A4" stroke-opacity=".6"/><text x="72" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#42D6A4" text-anchor="middle" >01</text><text x="103" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#F3F6FC" text-anchor="start" >n8n Credentials</text><circle cx="62" cy="198" r="3" fill="#42D6A4"/><text x="74" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Discord Bot Token</text><circle cx="62" cy="224" r="3" fill="#42D6A4"/><text x="74" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >AI provider API key</text><circle cx="62" cy="250" r="3" fill="#42D6A4"/><text x="74" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Google service-account key</text><rect x="430" y="120" width="340" height="176" rx="16" fill="#17243A" stroke="#30445F"/><rect x="446" y="137" width="36" height="36" rx="10" fill="#7F98FF" fill-opacity=".16" stroke="#7F98FF" stroke-opacity=".6"/><text x="464" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#7F98FF" text-anchor="middle" >02</text><text x="495" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#F3F6FC" text-anchor="start" >Google Sheets</text><circle cx="454" cy="198" r="3" fill="#7F98FF"/><text x="466" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Channel IDs + schedules</text><circle cx="454" cy="224" r="3" fill="#7F98FF"/><text x="466" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Message templates</text><circle cx="454" cy="250" r="3" fill="#7F98FF"/><text x="466" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Delivery logs</text><rect x="822" y="120" width="340" height="176" rx="16" fill="#17243A" stroke="#30445F"/><rect x="838" y="137" width="36" height="36" rx="10" fill="#A89AFF" fill-opacity=".16" stroke="#A89AFF" stroke-opacity=".6"/><text x="856" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#A89AFF" text-anchor="middle" >03</text><text x="887" y="159" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#F3F6FC" text-anchor="start" >AI Provider</text><circle cx="846" cy="198" r="3" fill="#A89AFF"/><text x="858" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Receives command context</text><circle cx="846" cy="224" r="3" fill="#A89AFF"/><text x="858" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Use provider you trust</text><circle cx="846" cy="250" r="3" fill="#A89AFF"/><text x="858" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#A3B2CA" text-anchor="start" >Review data-retention terms</text><path d="M378 207h48m-6-6 6 6-6 6M770 207h48m-6-6 6 6-6 6" fill="none" stroke="#667FA6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="326" width="1124" height="64" rx="13" fill="#392923" stroke="#77513C"/><text x="60" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#F6C66D" text-anchor="start" >RECOMMENDED</text><text x="60" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#F3F6FC" text-anchor="start" >Use an official Discord bot token. Never commit tokens, private keys, or personal credentials.</text></svg>