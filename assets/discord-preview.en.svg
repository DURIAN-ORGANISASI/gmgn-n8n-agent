channels appear as separate fields.</text><rect x="635" y="192" width="49" height="49" rx="16" fill="#8E7CFF"/><text x="660" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" >AI</text><rect x="700" y="180" width="430" height="164" rx="12" fill="#2C303B" stroke="#434957"/><rect x="700" y="180" width="5" height="164" rx="2" fill="#7F98FF"/><text x="722" y="207" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" fill="#F3F6FC" text-anchor="start" >Command result</text><text x="722" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#46D5E5" text-anchor="start" >!ai list channels</text><text x="722" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" fill="#F3F6FC" text-anchor="start" >2 active channels · 1 inactive</text><text x="722" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#A3B2CA" text-anchor="start" >Processed by the daily AI command flow.</text><rect x="61" y="367" width="1069" height="35" rx="9" fill="#292D38" stroke="#3E4654"/><text x="82" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#ADB7C9" text-anchor="start" >Illustrative data only — no live server, channel, or message identifiers.</text></svg>