<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Arsitektur sistem</title>
  <desc id="d">Alur antara pengguna di Discord, n8n di Railway, Google Sheets, model AI, dan channel target</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .hd{font-size:15px;font-weight:700;fill:#0f172a}
      .tx{font-size:13px;fill:#334155}
      .sm{font-size:12px;fill:#64748b}
      .ln{stroke:#6b7280;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .lbl{font-size:12px;fill:#475569;font-weight:700}
    </style>
  </defs>
  <rect width="1100" height="620" fill="#f8fafc"/>

  <!-- Pengguna / Discord pemantau -->
  <rect class="box" x="30" y="60" width="230" height="130" rx="12" stroke="#5865f2"/>
  <rect x="30" y="60" width="230" height="34" rx="12" fill="#5865f2"/><rect x="30" y="80" width="230" height="14" fill="#5865f2"/>
  <text x="145" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Discord: channel pemantau</text>
  <text class="tx" x="46" y="118">Kamu mengetik:</text>
  <text class="tx" x="46" y="140" font-family="monospace">!ai tambah channel ...</text>
  <text class="tx" x="46" y="166">Menerima balasan + bukti</text>

  <!-- n8n -->
  <rect x="340" y="30" width="430" height="560" rx="16" fill="#fff5f3" stroke="#ff6d5a" stroke-width="2"/>
  <text x="555" y="58" text-anchor="middle" font-size="17" font-weight="800" fill="#c2410c">n8n (self-hosted di Railway)</text>

  <rect class="box" x="365" y="80" width="380" height="200" rx="10"/>
  <text class="hd" x="383" y="104">Alur 2: AI Agent (sekali sehari, 00:01)</text>
  <text class="tx" x="383" y="128">1. Baca semua pesan baru sejak kemarin</text>
  <text class="tx" x="383" y="148">2. Filter: awalan !ai + user ID admin</text>
  <text class="tx" x="383" y="168">3. AI Agent memilih tool yang diperlukan</text>
  <text class="tx" x="383" y="188">4. Ubah / baca Google Sheets, cek Discord</text>
  <text class="tx" x="383" y="208">5. Balas ke channel pemantau (reply)</text>
  <text class="sm" x="383" y="238">Tool: lihat/tambah/ubah channel, pesan, log,</text>
  <text class="sm" x="383" y="256">info channel &amp; server, kirim sekarang</text>

  <rect class="box" x="365" y="310" width="380" height="250" rx="10"/>
  <text class="hd" x="383" y="334">Alur 1: Scheduler (tanpa AI)</text>
  <text class="tx" x="383" y="358">1. Cron 07:00: baca Config + Channels + Messages</text>
  <text class="tx" x="383" y="378">2. Susun antrean: GM sekarang, GN di jam gn_time</text>
  <text class="tx" x="383" y="398">3. Pilih 1 pesan GM + 1 GN untuk SEMUA channel</text>
  <text class="tx" x="383" y="418">4. Tunggu jam kirim + jeda acak antar channel</text>
  <text class="tx" x="383" y="438">5. Ambil nama channel &amp; server dari Discord</text>
  <text class="tx" x="383" y="458">6. Kirim pesan, catat hasil ke sheet Logs</text>
  <text class="tx" x="383" y="478">7. Kirim bukti (1 baris/entri) ke channel pemantau</text>
  <text class="sm" x="383" y="512">Deterministik: jadwal tidak bergantung pada tebakan model.</text>
  <text class="sm" x="383" y="532">Satu eksekusi per hari; baris channel ganda dilewati.</text>

  <!-- Model AI -->
  <rect class="box" x="850" y="50" width="220" height="100" rx="12" stroke="#3b82f6"/>
  <rect x="850" y="50" width="220" height="34" rx="12" fill="#3b82f6"/><rect x="850" y="70" width="220" height="14" fill="#3b82f6"/>
  <text x="960" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Model AI</text>
  <text class="tx" x="868" y="108">Gemini Flash-Lite (default)</text>
  <text class="tx" x="868" y="130">atau Groq (Llama) / lainnya</text>

  <!-- Google Sheets -->
  <rect class="box" x="850" y="200" width="220" height="190" rx="12" stroke="#1d9e5a"/>
  <rect x="850" y="200" width="220" height="34" rx="12" fill="#1d9e5a"/><rect x="850" y="220" width="220" height="14" fill="#1d9e5a"/>
  <text x="960" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Google Sheets</text>
  <text class="tx" x="868" y="260">Config   (pengaturan)</text>
  <text class="tx" x="868" y="284">Channels (ID + jam)</text>
  <text class="tx" x="868" y="308">Messages (pesan + bobot)</text>
  <text class="tx" x="868" y="332">Logs     (bukti kirim)</text>
  <text class="sm" x="868" y="366">Akses via Service Account</text>

  <!-- Channel target -->
  <rect class="box" x="850" y="430" width="220" height="130" rx="12" stroke="#5865f2"/>
  <rect x="850" y="430" width="220" height="34" rx="12" fill="#5865f2"/><rect x="850" y="450" width="220" height="14" fill="#5865f2"/>
  <text x="960" y="453" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Discord: channel target</text>
  <text class="tx" x="868" y="488">Server A › #gm-gn</text>
  <text class="tx" x="868" y="508">Server B › #general</text>
  <text class="tx" x="868" y="528">Server C › #morning</text>

  <!-- panah -->
  <path class="ln" d="M260 110 L365 130"/>
  <text class="lbl" x="290" y="108">perintah</text>
  <path class="ln" d="M365 175 L262 160"/>
  <text class="lbl" x="285" y="190">balasan</text>
  <path class="ln" d="M745 120 L850 100"/>
  <text class="lbl" x="752" y="100">tool calling</text>
  <path class="ln" d="M745 235 L850 250"/>
  <text class="lbl" x="752" y="228">baca / tulis</text>
  <path class="ln" d="M745 360 L850 335"/>
  <text class="lbl" x="752" y="378">baca / tulis</text>
  <path class="ln" d="M745 500 L850 495"/>
  <text class="lbl" x="752" y="490">kirim GM/GN</text>
  <path class="ln" d="M365 520 C 250 520 160 400 145 192"/>
  <text class="lbl" x="196" y="548">bukti pengiriman</text>
</svg>
