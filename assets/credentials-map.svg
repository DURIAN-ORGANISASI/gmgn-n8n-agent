<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Peta credential ke node</title>
  <desc id="d">Empat credential n8n dan node yang memakainya</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .hd{font-size:15px;font-weight:700;fill:#0f172a}
      .tx{font-size:13px;fill:#334155}
      .sm{font-size:12px;fill:#64748b}
      .ln{stroke:#6b7280;stroke-width:1.8;fill:none;marker-end:url(#ar)}
    </style>
  </defs>
  <rect width="1000" height="470" fill="#f8fafc"/>
  <text x="30" y="34" font-size="13" font-weight="700" fill="#475569">CREDENTIAL DI n8n</text>
  <text x="560" y="34" font-size="13" font-weight="700" fill="#475569">DIPAKAI OLEH NODE</text>

  <!-- 1 Google SA -->
  <rect class="box" x="30" y="50" width="400" height="92" rx="10" stroke="#1d9e5a" stroke-width="2"/>
  <text class="hd" x="46" y="76">1. Google Service Account API</text>
  <text class="tx" x="46" y="98">Nama: Google Service Account (GM/GN)</text>
  <text class="sm" x="46" y="118">Isi: client_email + private_key (dari file JSON)</text>
  <text class="sm" x="46" y="134">Sheet harus di-share ke client_email sebagai Editor</text>
  <rect class="box" x="560" y="50" width="410" height="92" rx="10"/>
  <text class="tx" x="576" y="76">Get Config, Get Messages, Get Channels, Simpan Log,</text>
  <text class="tx" x="576" y="96">Get Config1, Simpan Cursor, dan 7 tool Sheets:</text>
  <text class="tx" x="576" y="116">lihat_channel, tambah_channel, ubah_channel,</text>
  <text class="tx" x="576" y="134">lihat_pesan, tambah_pesan, lihat_log, tambah_log</text>
  <path class="ln" d="M430 96 L560 96"/>

  <!-- 2 Discord -->
  <rect class="box" x="30" y="160" width="400" height="104" rx="10" stroke="#5865f2" stroke-width="2"/>
  <text class="hd" x="46" y="186">2. Header Auth (Discord)</text>
  <text class="tx" x="46" y="208">Nama: Discord User Token</text>
  <text class="sm" x="46" y="228">Name: Authorization</text>
  <text class="sm" x="46" y="244">Value: Bot &lt;token&gt;  (bot resmi)  atau  &lt;token&gt;  (akun)</text>
  <rect class="box" x="560" y="160" width="410" height="104" rx="10"/>
  <text class="tx" x="576" y="186">Info Channel, Info Server, Kirim ke Discord,</text>
  <text class="tx" x="576" y="206">Kirim Bukti ke Channel Pemantau, Ambil Pesan Baru,</text>
  <text class="tx" x="576" y="226">Balas ke Channel Pemantau, dan tool:</text>
  <text class="tx" x="576" y="246">info_channel, info_server, kirim_sekarang</text>
  <path class="ln" d="M430 212 L560 212"/>

  <!-- 3 Gemini -->
  <rect class="box" x="30" y="282" width="400" height="80" rx="10" stroke="#3b82f6" stroke-width="2"/>
  <text class="hd" x="46" y="308">3. Google Gemini(PaLM) Api  (default)</text>
  <text class="tx" x="46" y="330">Isi: API Key dari Google AI Studio</text>
  <text class="sm" x="46" y="348">Host biarkan default</text>
  <rect class="box" x="560" y="282" width="410" height="80" rx="10"/>
  <text class="tx" x="576" y="312">Google Gemini Chat Model</text>
  <text class="sm" x="576" y="332">terhubung ke port Chat Model di AI Agent GM/GN</text>
  <path class="ln" d="M430 322 L560 322"/>

  <!-- 4 Groq -->
  <rect class="box" x="30" y="380" width="400" height="72" rx="10" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="hd" x="46" y="406">4. Groq  (opsional, pengganti Gemini)</text>
  <text class="tx" x="46" y="428">Isi: API Key dari console.groq.com</text>
  <rect class="box" x="560" y="380" width="410" height="72" rx="10" stroke-dasharray="6 4"/>
  <text class="tx" x="576" y="408">Groq Chat Model (tambah sendiri, hapus node Gemini)</text>
  <text class="sm" x="576" y="428">sambungkan ke port Chat Model di AI Agent GM/GN</text>
  <path class="ln" d="M430 416 L560 416"/>
</svg>
