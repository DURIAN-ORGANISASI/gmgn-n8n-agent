<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-labelledby="title desc">
<title id="title">Credentials map</title><desc id="desc">Peta credential layanan dan data konfigurasi.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A101D"/><stop offset=".55" stop-color="#111A2B"/><stop offset="1" stop-color="#171A35"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF806E"/><stop offset="1" stop-color="#A89AFF"/></linearGradient>
 <linearGradient id="bluegreen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7F98FF"/><stop offset="1" stop-color="#46D5E5"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8CA4CE" fill-opacity=".12"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#030713" flood-opacity=".32"/></filter>
</defs>
<rect width="1200" height="475" rx="22" fill="url(#bg)"/><rect width="1200" height="475" rx="22" fill="url(#dots)"/>
<circle cx="1080" cy="40" r="210" fill="#A89AFF" opacity=".045"/><rect x="1" y="1" width="1198" height="473" rx="21" fill="none" stroke="#2A3A54"/>
<text x="40" y="45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#46D5E5" text-anchor="start" >CREDENTIAL DAN KONEKSI</text><text x="40" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#F3F6FC" text-anchor="start" >Simpan rahasia di n8n. Simpan konfigurasi di Sheets.</text><rect x="38" y="115" width="355" height="135" rx="16" fill="#17243A" stroke="#30445F"/><rect x="54" y="132" width="38" height="38" rx="11" fill="#42D6A4" fill-opacity=".16" stroke="#42D6A4" stroke-opacity=".55"/><text x="73" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#42D6A4" text-anchor="middle" >01</text><text x="105" y="146" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#F3F6FC" text-anchor="start" >GOOGLE SERVICE ACCOUNT</text><text x="105" y="166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A3B2CA" text-anchor="start" >Baca/tulis spreadsheet</text><path d="M54 193H377" stroke="#30435E"/><text x="55" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#42D6A4" text-anchor="start" >Google Sheets API</text><rect x="422" y="115" width="355" height="135" rx="16" fill="#17243A" stroke="#30445F"/><rect x="438" y="132" width="38" height="38" rx="11" fill="#A89AFF" fill-opacity=".16" stroke="#A89AFF" stroke-opacity=".55"/><text x="457" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#A89AFF" text-anchor="middle" >02</text><text x="489" y="146" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#F3F6FC" text-anchor="start" >DISCORD HEADER AUTH</text><text x="489" y="166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A3B2CA" text-anchor="start" >Disarankan Discord Bot Token</text><path d="M438 193H761" stroke="#30435E"/><text x="439" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#A89AFF" text-anchor="start" >Authorization: Bot &lt;token&gt;</text><rect x="806" y="115" width="355" height="135" rx="16" fill="#17243A" stroke="#30445F"/><rect x="822" y="132" width="38" height="38" rx="11" fill="#7F98FF" fill-opacity=".16" stroke="#7F98FF" stroke-opacity=".55"/><text x="841" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#7F98FF" text-anchor="middle" >03</text><text x="873" y="146" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#F3F6FC" text-anchor="start" >AI MODEL PROVIDER</text><text x="873" y="166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A3B2CA" text-anchor="start" >Gemini atau model tool-calling</text><path d="M822 193H1145" stroke="#30435E"/><text x="823" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#7F98FF" text-anchor="start" >API key in n8n Credentials</text><rect x="230" y="283" width="355" height="135" rx="16" fill="#17243A" stroke="#30445F"/><rect x="246" y="300" width="38" height="38" rx="11" fill="#FF806E" fill-opacity=".16" stroke="#FF806E" stroke-opacity=".55"/><text x="265" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#FF806E" text-anchor="middle" >04</text><text x="297" y="314" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#F3F6FC" text-anchor="start" >MONITOR WEBHOOK (OPTIONAL)</text><text x="297" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A3B2CA" text-anchor="start" >Embed untuk status dan balasan</text><path d="M246 361H569" stroke="#30435E"/><text x="247" y="388" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#FF806E" text-anchor="start" >URL kept in Config sheet</text><rect x="614" y="283" width="355" height="135" rx="16" fill="#17243A" stroke="#30445F"/><rect x="630" y="300" width="38" height="38" rx="11" fill="#46D5E5" fill-opacity=".16" stroke="#46D5E5" stroke-opacity=".55"/><text x="649" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#46D5E5" text-anchor="middle" >05</text><text x="681" y="314" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900" fill="#F3F6FC" text-anchor="start" >WORKFLOW CONFIGURATION</text><text x="681" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="550" fill="#A3B2CA" text-anchor="start" >ID, jadwal, dan data pesan</text><path d="M630 361H953" stroke="#30435E"/><text x="631" y="388" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#46D5E5" text-anchor="start" >Config · Channels · Messages · Logs</text><text x="40" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" fill="#F6C66D" text-anchor="start" >Jangan commit API key, JSON service account, atau token Discord.</text></svg>