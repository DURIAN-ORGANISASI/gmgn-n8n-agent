<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">GM/GN AI Agent untuk n8n</title>
  <desc id="d">Banner proyek: otomatisasi GM dan GN Discord dengan n8n, Google Sheets, dan AI Agent</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226"/><stop offset="0.55" stop-color="#171a3a"/><stop offset="1" stop-color="#241a4d"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#7c83ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd37a"/><stop offset="1" stop-color="#ff9f43"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="340" fill="url(#bg)"/>
  <g opacity="0.55">
    <circle cx="980" cy="60" r="1.6" fill="#fff"/><circle cx="1120" cy="120" r="1.2" fill="#fff"/>
    <circle cx="1210" cy="40" r="1.8" fill="#fff"/><circle cx="900" cy="150" r="1.2" fill="#fff"/>
    <circle cx="1060" cy="260" r="1.4" fill="#fff"/><circle cx="1180" cy="290" r="1.2" fill="#fff"/>
    <circle cx="840" cy="40" r="1.2" fill="#fff"/><circle cx="1240" cy="190" r="1.4" fill="#fff"/>
  </g>
  <!-- matahari (GM) dan bulan (GN) -->
  <circle cx="1010" cy="170" r="62" fill="url(#sun)"/>
  <circle cx="1150" cy="170" r="62" fill="#dfe3ff"/>
  <circle cx="1118" cy="206" r="9" fill="#c4c9f5"/><circle cx="1186" cy="140" r="7" fill="#c4c9f5"/><circle cx="1190" cy="204" r="5" fill="#c4c9f5"/>
  <text x="1010" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#5a3300">GM</text>
  <text x="1150" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#1b1d42">GN</text>
  <!-- judul -->
  <text x="72" y="128" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="url(#ac)">GM/GN AI Agent</text>
  <text x="72" y="180" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e6e8ff">Otomatisasi GM &amp; GN Discord dengan n8n</text>
  <text x="72" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#aab0e8">Atur channel, jam, dan pesan lewat chat. Semua tersimpan di Google Sheets.</text>
  <!-- chip teknologi -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <rect x="72" y="256" width="82" height="36" rx="18" fill="#ff6d5a"/><text x="113" y="279" text-anchor="middle" fill="#fff">n8n</text>
    <rect x="166" y="256" width="146" height="36" rx="18" fill="#1d9e5a"/><text x="239" y="279" text-anchor="middle" fill="#fff">Google Sheets</text>
    <rect x="324" y="256" width="104" height="36" rx="18" fill="#5865f2"/><text x="376" y="279" text-anchor="middle" fill="#fff">Discord</text>
    <rect x="440" y="256" width="150" height="36" rx="18" fill="#3b82f6"/><text x="515" y="279" text-anchor="middle" fill="#fff">Gemini / Groq</text>
    <rect x="602" y="256" width="102" height="36" rx="18" fill="#6b4df5"/><text x="653" y="279" text-anchor="middle" fill="#fff">Railway</text>
  </g>
</svg>
