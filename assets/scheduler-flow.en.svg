<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Scheduler flow</title><desc id="desc">The daily sender flow from trigger to delivery proof.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A101D"/><stop offset=".55" stop-color="#111A2B"/><stop offset="1" stop-color="#171A35"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF806E"/><stop offset="1" stop-color="#A89AFF"/></linearGradient>
 <linearGradient id="bluegreen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7F98FF"/><stop offset="1" stop-color="#46D5E5"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8CA4CE" fill-opacity=".12"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#030713" flood-opacity=".32"/></filter>
</defs>
<rect width="1200" height="410" rx="22" fill="url(#bg)"/><rect width="1200" height="410" rx="22" fill="url(#dots)"/>
<circle cx="1080" cy="40" r="210" fill="#A89AFF" opacity=".045"/><rect x="1" y="1" width="1198" height="408" rx="21" fill="none" stroke="#2A3A54"/>
<text x="40" y="45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="900" fill="#46D5E5" text-anchor="start" >DAILY DELIVERY FLOW</text><text x="40" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#F3F6FC" text-anchor="start" >Deterministic schedule — no AI in the sender path.</text><rect x="38" y="132" width="205" height="142" rx="15" fill="#17243A" stroke="#30445F"/><circle cx="63" cy="158" r="14" fill="#FF806E" fill-opacity=".18" stroke="#FF806E"/><text x="63" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="900" fill="#FF806E" text-anchor="middle" >01</text><text x="54" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" fill="#F3F6FC" text-anchor="start" >07:00 trigger</text><text x="54" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#A3B2CA" text-anchor="start" >Timezone from n8n</text><rect x="54" y="244" width="173" height="5" rx="2.5" fill="#FF806E" fill-opacity=".7"/><path d="M246 202h16m-5-5 5 5-5 5" fill="none" stroke="#46D5E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="267" y="132" width="205" height="142" rx="15" fill="#17243A" stroke="#30445F"/><circle cx="292" cy="158" r="14" fill="#42D6A4" fill-opacity=".18" stroke="#42D6A4"/><text x="292" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="900" fill="#42D6A4" text-anchor="middle" >02</text><text x="283" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" fill="#F3F6FC" text-anchor="start" >Read Sheets</text><text x="283" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#A3B2CA" text-anchor="start" >Config · Channels · Messages</text><rect x="283" y="244" width="173" height="5" rx="2.5" fill="#42D6A4" fill-opacity=".7"/><path d="M475 202h16m-5-5 5 5-5 5" fill="none" stroke="#46D5E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="132" width="205" height="142" rx="15" fill="#17243A" stroke="#30445F"/><circle cx="521" cy="158" r="14" fill="#7F98FF" fill-opacity=".18" stroke="#7F98FF"/><text x="521" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="900" fill="#7F98FF" text-anchor="middle" >03</text><text x="512" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" fill="#F3F6FC" text-anchor="start" >Build queue</text><text x="512" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#A3B2CA" text-anchor="start" >Choose GM + GN once</text><rect x="512" y="244" width="173" height="5" rx="2.5" fill="#7F98FF" fill-opacity=".7"/><path d="M704 202h16m-5-5 5 5-5 5" fill="none" stroke="#46D5E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="725" y="132" width="205" height="142" rx="15" fill="#17243A" stroke="#30445F"/><circle cx="750" cy="158" r="14" fill="#A89AFF" fill-opacity=".18" stroke="#A89AFF"/><text x="750" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="900" fill="#A89AFF" text-anchor="middle" >04</text><text x="741" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" fill="#F3F6FC" text-anchor="start" >Send by time</text><text x="741" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#A3B2CA" text-anchor="start" >GM now · GN at gn_time</text><rect x="741" y="244" width="173" height="5" rx="2.5" fill="#A89AFF" fill-opacity=".7"/><path d="M933 202h16m-5-5 5 5-5 5" fill="none" stroke="#46D5E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="954" y="132" width="205" height="142" rx="15" fill="#17243A" stroke="#30445F"/><circle cx="979" cy="158" r="14" fill="#46D5E5" fill-opacity=".18" stroke="#46D5E5"/><text x="979" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" font-weight="900" fill="#46D5E5" text-anchor="middle" >05</text><text x="970" y="201" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" fill="#F3F6FC" text-anchor="start" >Log + proof</text><text x="970" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="550" fill="#A3B2CA" text-anchor="start" >Sheets Logs + monitor</text><rect x="970" y="244" width="173" height="5" rx="2.5" fill="#46D5E5" fill-opacity=".7"/><rect x="38" y="315" width="1121" height="68" rx="14" fill="#172B36" stroke="#2A5D62"/><text x="60" y="341" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="900" fill="#46D5E5" text-anchor="start" >IMPORTANT BEHAVIOR</text><text x="60" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#F3F6FC" text-anchor="start" >One shared GM and one shared GN message are selected per day; duplicate channel rows are skipped.</text></svg>